name: Release

# Il repo tiene due progetti affiancati: `alia/` (l'app) e `api/` (la confluenza
# delle sorgenti). Il rilascio riguarda solo l'app, quindi ogni job lavora
# dentro `alia/` — senza questo, `npm ci` cercherebbe un package.json nella
# radice, dove non c'e'.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  verify-macos:
    # Il pacchetto npm pubblicato è lo stesso per ogni piattaforma (Electron
    # viene scaricato per l'OS corretto al momento dell'installazione, non è
    # incluso nel tarball): qui verifichiamo solo che core e build funzionino
    # anche su macOS prima di rilasciare, non produciamo un artifact separato.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: alia
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.16"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build renderer
        run: npm run build:renderer

  package:
    needs: verify-macos
    runs-on: windows-latest
    defaults:
      run:
        working-directory: alia
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.16"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build renderer
        run: npm run build:renderer

      - name: Set package version from release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Pack npm tarball
        shell: bash
        run: npm pack

      - name: Upload tarball to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" alia-*.tgz --clobber
