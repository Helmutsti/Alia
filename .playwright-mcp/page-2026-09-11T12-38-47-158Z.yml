  - generic [ref=e110]:
    - generic [ref=e111]: Come si tiene
    - heading "Il sorgente è l'SVG, il .ico si genera" [level=2] [ref=e112]
    - paragraph [ref=e113]: "Fino a oggi la sorgente non esisteva: c'era solo icon.ico, e ogni modifica sarebbe stata un ritocco di pixel su una copia — «un po' più grande» non si sarebbe potuto nemmeno chiedere. Ora build/icon.svg è la sorgente e npm run icona rigenera il file a quattro misure passando da Electron, che l'SVG lo sa disegnare davvero. Ridisegnare le stesse forme con una libreria grafica avrebbe messo la geometria in due posti, e due posti prima o poi divergono: si ritocca l'SVG, l'icona resta quella di prima, e non se ne accorge nessuno finché non si guardano vicine."
    - paragraph [ref=e114]: "Le quattro misure si disegnano una per una invece di rimpicciolire la più grande: a 16px un tratto da 21.7 ridotto sedici volte diventa una scia grigia, disegnato a quella misura resta un tratto. Cambiare variante è sostituire le due righe del linearGradient."