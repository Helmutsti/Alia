<!-- L'icona di Alia. Questo file è la sorgente: `icon.ico` si genera da qui.

     Fino all'11/09/2026 la sorgente non esisteva — c'era solo il `.ico`, e ogni
     modifica sarebbe stata un ritocco di pixel su una copia. La geometria qui
     sotto è stata **misurata** su quel file, non ridisegnata a occhio:

       · il quadrato occupava 193px su 256 (75% della tela), con angoli di
         raggio 41px, cioè il 21,3% del lato;
       · il glifo è una spezzata di due segmenti — non due tratti separati —
         spessa 19px, con estremi e giunto tondi. I vertici misurati erano
         (86.4, 163) → (168, 96) → (168, 147.5), e il cap tondo in basso cade
         esattamente sull'angolo del riquadro visibile: la conferma che la
         lettura è giusta.

     ── Cos'è cambiato ──────────────────────────────────────────────────────

     Il quadrato passa da 193 a 220px (dal 75% all'86% della tela). Era quello
     che lo faceva sembrare più piccolo delle icone di sistema: non la misura
     del file, ma il margine dentro di esso. Il glifo cresce in proporzione,
     quindi il disegno è identico — è solo più vicino al bordo.

     Il glifo diventa bianco pieno. Era #E9EAEA, un grigio chiarissimo che su
     un fondo piatto non si notava; su un gradiente sembra sporco.

     ── Il gradiente ────────────────────────────────────────────────────────

     Un solo posto da cambiare, qui sotto. Le tre varianti provate:

       · diagonale (in uso)  x1=0 y1=0 x2=1 y2=1, #5BBEF7 → #2585D4.
                             La luce arriva da in alto a sinistra e il colore
                             si satura verso il basso a destra: è il gradiente
                             che si legge come volume, e la forma sembra
                             leggermente curva invece che piatta.
       · fianco              x1=0 y1=0 x2=1 y2=0, stop 0 #45AEEE,
                             0.62 #3BA5E8, 1 #1477CC. Il fondo resta quello di
                             prima per due terzi e si satura solo sul bordo.
       · verticale           x1=0 y1=0 x2=0 y2=1, #5CBCF5 → #2189D6.
                             La convenzione più antica, la meno appariscente.

     A 16px il gradiente sparisce comunque e conta solo il colore medio: a
     quella misura le tre si somigliano molto più di quanto non facciano a 256,
     ed è il motivo per cui la scelta si fa guardando la grande. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5BBEF7" />
      <stop offset="1" stop-color="#2585D4" />
    </linearGradient>
  </defs>

  <rect x="18" y="18" width="220" height="220" rx="46.8" fill="url(#fondo)" />

  <path
    d="M 80.6 167.9 L 173.6 91.5 L 173.6 150.3"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="21.7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
